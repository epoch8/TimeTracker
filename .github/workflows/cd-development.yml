name: CD - Development Build

# Publish the fork image on demand with v<upstream>-e8.<workflow run number>.
# The upstream version comes from VERSION; the build counter does not reset
# when the upstream version changes. Re-runs reuse the same version tag.
# Smoke tests must pass before push unless force_build=true.

on:
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force build even if tests fail'
        required: false
        type: boolean
        default: false

concurrency:
  group: dev-build-${{ github.ref }}
  # Finish in-flight publishes; newer runs queue.
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PYTHON_VERSION: '3.11'

jobs:
  quick-tests:
    name: Quick Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_USER: test_user
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python-env
      - name: Run smoke tests
        env:
          PYTHONPATH: ${{ github.workspace }}
          DATABASE_URL: postgresql+psycopg2://test_user:test_password@localhost:5432/test_db
          FLASK_ENV: testing
        run: pytest -m smoke -v --tb=short --no-cov -n auto

  build-and-push:
    name: Build and Push Development Image
    runs-on: ubuntu-latest
    needs: quick-tests
    if: always() && (needs.quick-tests.result == 'success' || github.event.inputs.force_build == 'true')
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase image name
        id: image-name
        run: |
          IMAGE_NAME_LOWER=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME_LOWER=${IMAGE_NAME_LOWER}" >> $GITHUB_OUTPUT

      - name: Determine version
        id: version
        run: |
          set -euo pipefail
          UPSTREAM_VERSION=$(cat VERSION)
          if [[ ! "$UPSTREAM_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected a single upstream X.Y.Z version in VERSION"
            exit 1
          fi
          VERSION="v${UPSTREAM_VERSION}-e8.${GITHUB_RUN_NUMBER}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image-name.outputs.IMAGE_NAME_LOWER }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.description=Self-hosted time tracking web application for projects, clients, and reports.

      - name: Inject donate-hide public key (optional)
        env:
          DONATE_HIDE_PUBLIC_KEY_PEM: ${{ secrets.DONATE_HIDE_PUBLIC_KEY_PEM }}
        run: |
          if [ -n "$DONATE_HIDE_PUBLIC_KEY_PEM" ]; then
            echo "$DONATE_HIDE_PUBLIC_KEY_PEM" > donate_hide_public.pem
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "## Fork image"
            echo ""
            echo "- Version: \`${{ steps.version.outputs.version }}\`"
            echo "- GHCR: \`${{ steps.image-name.outputs.IMAGE_NAME_LOWER }}:${{ steps.version.outputs.version }}\`"
            echo ""
            echo "Publish is manual only (workflow_dispatch). Select the develop branch to build the current fork."
          } >> "$GITHUB_STEP_SUMMARY"
